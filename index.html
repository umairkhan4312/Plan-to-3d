<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Office 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#dcdcdc;--pn:#101a29;--tile:#182538;--fg:#fff;--mut:#9fb0c8;--on:#2f7bff;--ok:#2bd46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#lb{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;line-height:1.15;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.9);color:#111;text-align:center}
.l.r{background:#111c2d;color:#fff;font-size:13px;font-weight:600;padding:5px 10px}
.l.p i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#999;margin-left:5px}
.l.p.a i{background:var(--ok)}
.vt{position:absolute;right:10px;top:10px;display:flex;background:#101a29;border-radius:8px;padding:3px;gap:3px}.vt button{border:0;background:transparent;color:#9fb0c8;padding:7px 16px;border-radius:6px;font:600 13px system-ui;cursor:pointer}.vt button[aria-pressed=true]{background:#2f7bff;color:#fff}
#pn{background:var(--pn);padding:10px;display:flex;gap:8px;overflow-x:auto;border-radius:12px 12px 0 0}
.t{flex:0 0 108px;background:var(--tile);color:var(--fg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12px;cursor:pointer;border:0;text-align:left;font-family:inherit}
.t b{font-size:12px;font-weight:600}.t .v{font-size:18px}.t .s{color:var(--mut);display:flex;align-items:center;gap:6px}
.sw{width:42px;height:22px;border-radius:11px;background:#465469;position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.on .sw{background:var(--on)}.on .sw::after{left:22px}
.ok .s{color:var(--ok)}
.t:focus-visible{outline:2px solid #6fb0ff}
</style></head><body>
<div id="stage"><canvas id="c"></canvas><div id="lb"></div><div class="vt"><button id="b2" aria-pressed="false">2D</button><button id="b3" aria-pressed="true">3D</button></div></div>
<div id="pn"></div>
<script>
var H=2.2,OX=-10,OZ=-6.5;
var $=function(i){return document.getElementById(i)};
var cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}),scene=new THREE.Scene(),
    cam=new THREE.PerspectiveCamera(38,1,.1,300),root=new THREE.Group();
root.position.set(OX,0,OZ);scene.add(root);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a66,.8));
var sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-6,14,10);scene.add(sun);
function box(x,z,w,d,h,c,y0){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
  m.position.set(x+w/2,(y0||0)+h/2,z+d/2);root.add(m);return m}
function P(x,y,z){return new THREE.Vector3(x+OX,y,z+OZ)}

/* floors */
box(0,0,8,13,.1,0xdcb98c,-.1);box(8,0,5,13,.1,0xe3c79c,-.1);box(13,0,7,13,.1,0xdcb98c,-.1);
box(13,0,3,4,.1,0xe9d3ad,-.05);box(5,0,3,4.5,.1,0xf0f0ec,-.05);
/* walls */
var WC=0x1a2a40;
function wall(x1,z1,x2,z2){if(z1===z2)box(Math.min(x1,x2),z1-.15,Math.abs(x2-x1),.3,H,WC);else box(x1-.15,Math.min(z1,z2),.3,Math.abs(z2-z1),H,WC)}
[[0,0,20,0],[20,0,20,13],[0,13,0,0],[0,13,9.5,13],[11,13,20,13],
 [8,0,8,1.5],[8,2.8,8,9],[8,10.5,8,13],[13,0,13,2],[13,3.5,13,9],[13,10.5,13,13],
 [16,0,16,4],[13,4,16,4],[5,0,5,4.5],[5,4.5,8,4.5]].forEach(function(w){wall.apply(null,w)});
/* windows */
[[2,6],[9,12.5],[15,19]].forEach(function(w){box(w[0],-.05,w[1]-w[0],.4,1,0x5db4ff,.9)});
/* furniture: x,z,w,d,h,color,y0 */
[[.3,1.5,.6,5.5,2,0x5a2e1a],[2.5,5.2,3.6,1.2,.8,0x4b2a1a],[3.7,5.5,.9,.1,.5,0x222222,.8],[3.9,4.2,.7,.7,.9,0x111111],
 [3,7,.7,.7,.8,0x111111],[4.6,7,.7,.7,.8,0x111111],[.4,10,1.3,2.6,.8,0x1a1a1a],[.4,10,.4,2.6,1.2,0x1a1a1a],
 [6.9,.5,.7,1,.6,0xf5f5f5],[5.3,2,.6,.8,.9,0xf5f5f5],
 [9.3,1,3.4,1,.8,0x141414],[9.3,.8,3.4,.35,1.3,0x141414],[10,4,2.2,.9,.45,0x6b3a22],[8.4,5.5,.5,3,.9,0x6b3a22],
 [13.3,.3,1.8,.7,.9,0x8a8f96],[15.2,.4,.6,.7,1.8,0xb5bcc4],
 [19,1,.8,11.5,.8,0xf0f0f0],[13.4,6,.7,1,.8,0x8a6a3a]].forEach(function(f){box(f[0],f[1],f[2],f[3],f[4],f[5],f[6])});
[2,4.5,7,9.5,11.8].forEach(function(z){box(18,z,.7,.7,.9,0x111111)});
[[.8,.9],[12.3,1],[8.7,9],[13.6,5],[19.4,.5],[19.4,12.4],[15.6,3.3]].forEach(function(p){
  box(p[0]-.15,p[1]-.15,.3,.3,.3,0x7a4a2a);var s=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),new THREE.MeshLambertMaterial({color:0x2f8a3a}));
  s.position.set(p[0],.7,p[1]);root.add(s)});
/* entrance arrow */
var ar=new THREE.Mesh(new THREE.ConeGeometry(.5,1.2,12),new THREE.MeshBasicMaterial({color:0x2f7bff}));
ar.rotation.x=-Math.PI/2;ar.position.set(10.25,.3,14.2);root.add(ar);
/* curtain */
var cur=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.6,.1),new THREE.MeshLambertMaterial({color:0x9ad0ff}));cur.position.set(10.75,1.5,.35);root.add(cur);

/* state */
var S={lights:{lobby:1,mgmt:1,eng:1,kitchen:1},curtain:1,pres:{lobby:0,mgmt:0,eng:0,toilet:0},temp:24.5,hum:60.5};
var LP={mgmt:[[2,3],[2,11],[6,11],[4,2]],lobby:[[10.5,3],[10.5,6.2],[10.5,9],[9.2,11.5],[12,11.5]],eng:[[15.5,6],[17,9],[15,11.5]],kitchen:[[14.5,2]]};
var ctr={mgmt:[4,6.5],lobby:[10.5,6.5],eng:[16.5,8],kitchen:[14.5,2]},rings={},pl={};
Object.keys(LP).forEach(function(k){
  rings[k]=LP[k].map(function(p){var m=new THREE.Mesh(new THREE.RingGeometry(.22,.38,24),new THREE.MeshBasicMaterial({color:0xffc933,side:THREE.DoubleSide}));
    m.rotation.x=-Math.PI/2;m.position.set(p[0],.04,p[1]);root.add(m);return m});
  var l=new THREE.PointLight(0xfff0d0,.5,16);l.position.set(ctr[k][0],3,ctr[k][1]);root.add(l);pl[k]=l});

/* labels */
var labs=[];
function lab(t,cls,x,y,z,id){var e=document.createElement('div');e.className='l '+cls;e.innerHTML=t;$('lb').appendChild(e);labs.push({e:e,p:P(x,y,z)});return e}
lab('Lobby','r',10.5,.3,10.4);lab('Management Office','r',4,.3,9);lab('Engineering Office','r',16.5,.3,6);
lab('Kitchen','r',14.5,.3,3.3);lab('W.C.','r',6.5,.3,1.2);lab('Main Entrance','r',10.25,.3,14.9);
lab('Window<br>(Management)','',4,1.6,-.3);lab('Window<br>(Lobby)','',10.75,1.9,-.3);lab('Window<br>(Engineer)','',17,1.6,-.3);
var pe={mgmt:lab('Presence (Management)<i></i>','p',4.5,.5,10.6),lobby:lab('Presence (Lobby)<i></i>','p',10.5,.5,7.6),
        eng:lab('Presence (Engineering)<i></i>','p',16.5,.5,8),toilet:lab('Presence (Toilet)<i></i>','p',6.5,.5,3.3)};

/* panel */
var LN=[['lobby','Lobby Lights'],['mgmt','Management Lights'],['eng','Engineering Lights'],['kitchen','Kitchen Lights']],
    PN=[['lobby','Lobby Presence'],['mgmt','Management Presence'],['eng','Engineering Presence'],['toilet','Toilet Presence']];
function panel(){
  var h='';
  LN.forEach(function(l){h+='<button class="t '+(S.lights[l[0]]?'on':'')+'" data-l="'+l[0]+'"><b>'+l[1]+'</b><span class="s">'+(S.lights[l[0]]?'On':'Off')+'</span><span class="sw"></span></button>'});
  h+='<button class="t '+(S.curtain?'on':'')+'" data-c="1"><b>Lobby Curtain</b><span class="s">'+(S.curtain?'Open':'Closed')+'</span><span class="sw"></span></button>';
  h+='<div class="t"><b>Temperature</b><span class="v">'+S.temp.toFixed(1)+' &deg;C</span></div><div class="t"><b>Humidity</b><span class="v">'+S.hum.toFixed(1)+' %</span></div>';
  PN.forEach(function(p){var a=S.pres[p[0]];h+='<button class="t '+(a?'':'ok')+'" data-p="'+p[0]+'"><b>'+p[1]+'</b><span class="s">'+(a?'Occupied':'Clear')+'</span></button>'});
  $('pn').innerHTML=h;
}
$('pn').addEventListener('click',function(e){
  var b=e.target.closest('[data-l],[data-c],[data-p]');if(!b)return;
  if(b.dataset.l)S.lights[b.dataset.l]^=1;else if(b.dataset.c)S.curtain^=1;else if(b.dataset.p)S.pres[b.dataset.p]^=1;
  apply()});
function apply(){
  Object.keys(rings).forEach(function(k){var on=S.lights[k];rings[k].forEach(function(m){m.material.color.set(on?0xffc933:0x7a7a7a)});pl[k].intensity=on?.5:0});
  cur.scale.y=S.curtain?.15:1;cur.position.y=2.3-.8*cur.scale.y;
  Object.keys(pe).forEach(function(k){pe[k].classList.toggle('a',!!S.pres[k])});
  panel();render();
}
setInterval(function(){S.temp+=(Math.random()-.5)*.2;S.hum+=(Math.random()-.5)*.4;panel()},4000);

/* camera + render */
var flat=false,yaw=0,pit=.95,dist=30,tg=new THREE.Vector3(0,0,1);
function render(){
  var st=$('stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;
  ren.setPixelRatio(window.devicePixelRatio||1);ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  var d=dist*(w/h<1.2?1.5:1);
  cam.position.set(tg.x+d*Math.sin(yaw)*Math.cos(pit),tg.y+d*Math.sin(pit),tg.z+d*Math.cos(yaw)*Math.cos(pit));cam.lookAt(tg);
  ren.render(scene,cam);
  labs.forEach(function(l){var v=l.p.clone().project(cam);l.e.style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px) translate(-50%,-50%)';l.e.style.display=v.z>1?'none':'block'});
}
var pts={};
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',function(e){var p=pts[e.pointerId];if(!p)return;var ids=Object.keys(pts);
  if(ids.length===2){var o=pts[ids.filter(function(i){return +i!==e.pointerId})[0]];dist*=Math.hypot(p.x-o.x,p.y-o.y)/(Math.hypot(e.clientX-o.x,e.clientY-o.y)||1)}
  else if(!flat){yaw-=(e.clientX-p.x)*.008;pit=Math.min(1.5,Math.max(.25,pit+(e.clientY-p.y)*.008))}
  p.x=e.clientX;p.y=e.clientY;dist=Math.min(60,Math.max(10,dist));render()});
['pointerup','pointercancel'].forEach(function(t){cv.addEventListener(t,function(e){delete pts[e.pointerId]})});
cv.addEventListener('wheel',function(e){e.preventDefault();dist=Math.min(60,Math.max(10,dist*(e.deltaY>0?1.1:.9)));render()},{passive:false});
function mode(f){flat=f;if(f){yaw=0;pit=Math.PI/2-.001}else{yaw=0;pit=.95}
  $('b2').setAttribute('aria-pressed',f);$('b3').setAttribute('aria-pressed',!f);render()}
$('b2').onclick=function(){mode(true)};$('b3').onclick=function(){mode(false)};
window.addEventListener('resize',render);
apply();
</script></body></html>
